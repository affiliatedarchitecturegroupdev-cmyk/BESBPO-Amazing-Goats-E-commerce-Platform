name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Shared workspace packages must be built first so consumers resolve @ag/* types.
      - run: pnpm --filter "./packages/*" build
      - run: pnpm -r lint
      # `pnpm test` runs every workspace suite plus the root bootstrap contract.
      - run: pnpm test
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pytest fastapi httpx
      # Each service ships an `app` package, so they must run in separate processes.
      - run: pytest -q
        working-directory: services/ai-forecast
      - run: pytest -q
        working-directory: services/analytics
  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ag
          POSTGRES_PASSWORD: ag
          POSTGRES_DB: ag
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ag" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # Applies every migration and seed to a clean database, then runs the
      # row-level security tests (db/tests/rls.sql).
      - run: bash scripts/test-rls.sh
        env:
          DATABASE_URL: postgres://ag:ag@localhost:5432/ag
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ag/db build
      # The @ag/db adapter integration tests need a live database (they skip when
      # DATABASE_URL is unset, so the node job does not run them). They connect
      # as the service's superuser and provision their own NOSUPERUSER role to
      # assert that row-level security is enforced, not bypassed.
      - run: pnpm --filter @ag/db test
        env:
          DATABASE_URL: postgres://ag:ag@localhost:5432/ag
      # The payments SQL adapters exercise the real payments schema applied
      # above; their integration tests skip without DATABASE_URL.
      - run: pnpm --filter @ag/payments test
        env:
          DATABASE_URL: postgres://ag:ag@localhost:5432/ag
      # The accounts SQL adapters (credit limits, invoices, collections) exercise
      # the real accounts schema applied above; they skip without DATABASE_URL.
      - run: pnpm --filter @ag/accounts test
        env:
          DATABASE_URL: postgres://ag:ag@localhost:5432/ag
