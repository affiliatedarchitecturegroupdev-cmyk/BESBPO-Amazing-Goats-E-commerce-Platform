<!DOCTYPE html>
<html lang="en-ZA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Amazing Goats platform wireframes v2</title>
<style>
:root{--forest:#1F3B2D;--red:#B4492B;--cream:#F4ECD8;--ochre:#D6A23E;--bg:#FBF7EC;--sf:#fff;--tx:#25231F;--mu:#5d584d;--bd:#e3d9c0}
@media(prefers-color-scheme:dark){:root{--bg:#111a15;--sf:#1a2a21;--tx:#F4ECD8;--mu:#b9b19c;--bd:#2c4033}}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{background:var(--forest);color:var(--cream);padding:12px 16px}header b{font:italic 700 18px Georgia,serif}
.apps,.scrs{display:flex;gap:8px;flex-wrap:wrap;padding:10px 16px}.apps button,.scrs button{border:1px solid var(--bd);background:var(--sf);color:var(--tx);padding:6px 12px;border-radius:99px;cursor:pointer}
.apps button.on{background:var(--forest);color:var(--cream)}.scrs button.on{background:var(--red);color:#fff;border-color:var(--red)}
.note{max-width:760px;margin:0 auto;padding:0 16px;color:var(--mu);font-size:13px}
.frame{margin:12px auto 40px;border:2px solid var(--bd);border-radius:22px;padding:12px;background:var(--bg);width:min(100% - 24px,380px)}.frame.wide{width:min(100% - 24px,760px)}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:8px}.bar b{font:italic 700 17px Georgia,serif;color:var(--red)}.bar span{margin-left:auto;background:var(--forest);color:var(--cream);border-radius:99px;padding:1px 10px;font-size:12px}
.ban{background:var(--ochre);color:var(--forest);border-radius:10px;padding:7px 10px;margin-bottom:8px;font-size:13px}
.card{border:1px solid var(--bd);border-radius:14px;padding:9px;background:var(--sf);margin-bottom:8px}.card small{color:var(--mu)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.wide .grid{grid-template-columns:repeat(3,1fr)}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;background:var(--cream);color:var(--forest)}.tag.ad{background:var(--ochre)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.chips i{font-style:normal;border:1px solid var(--bd);border-radius:99px;padding:2px 10px;font-size:12px;background:var(--sf)}.chips i.on{background:var(--red);color:#fff;border-color:var(--red)}
.btn{display:block;text-align:center;background:var(--red);color:#fff;border-radius:10px;padding:9px;font-weight:600;margin:6px 0}.btn.o{background:none;border:1.5px solid var(--forest);color:var(--tx)}
.row{display:flex;justify-content:space-between;gap:8px;padding:3px 0}.h{font-weight:600;margin:10px 0 4px}.p{color:var(--mu);font-size:13px}
.img{height:84px;border-radius:10px;border:1px dashed var(--bd);display:grid;place-items:center;color:var(--mu);font-size:12px;background:repeating-linear-gradient(135deg,#1F3B2D18,#1F3B2D18 8px,#1F3B2D0a 8px,#1F3B2D0a 16px);margin-bottom:6px}
.fld{border:1px solid var(--bd);border-radius:8px;padding:7px 9px;color:var(--mu);font-size:12px;margin:5px 0;background:var(--sf)}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px}.wide .kpi{grid-template-columns:repeat(4,1fr)}.kpi div{border:1px solid var(--bd);border-radius:12px;padding:8px;background:var(--sf)}.kpi b{display:block;font-size:18px}
.meter{height:10px;border-radius:6px;background:var(--bd);overflow:hidden;margin:4px 0}.meter i{display:block;height:100%;background:var(--forest)}
table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:left;color:var(--mu);font-weight:500;border-bottom:1px solid var(--bd);padding:4px 3px}td{padding:5px 3px;border-bottom:1px solid var(--bd)}
.nav{display:flex;justify-content:space-around;border-top:1px solid var(--bd);padding-top:8px;margin-top:8px;font-size:11px;color:var(--mu)}
.ad{border:2px dashed var(--ochre);border-radius:10px;padding:6px;margin-bottom:8px;font-size:12px;text-align:center;color:var(--mu)}

const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function blk(b){const t=b[0];
 if(t==='bar')return `<div class="bar"><b>${esc(b[1])}</b>${b[2]?`<span>${esc(b[2])}</span>`:''}</div>`;

 if(t==='chips')return `<div class="chips">${b[1].map((c,i)=>`<i class="${i===b[2]?'on':''}">${esc(c)}</i>`).join('')}</div>`;
 if(t==='row')return `<div class="row"><span>${esc(b[1])}</span><span>${esc(b[2])}</span></div>`;
 if(t==='card')return `<div class="card"><b>${esc(b[1])}</b>${b[3]?` <span class="tag">${esc(b[3])}</span>`:''}<br><small>${esc(b[2])}</small></div>`;

 if(t==='btn')return `<div class="btn ${b[2]||''}">${esc(b[1])}</div>`;
